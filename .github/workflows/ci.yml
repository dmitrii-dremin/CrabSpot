name: Rust and Java 21 fixtures

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Report toolchain
        run: |
          rustc --version --verbose
          cargo --version
          javac -version
      - name: Verify checked-in source provenance
        run: |
          python -m unittest discover -s tools -p test_fixture_source.py
          python tools/check_fixture_sources.py
      - name: Test checked-in reference fixtures
        run: cargo test --workspace --locked
      - name: Compile reference fixtures with JDK 21
        run: python tools/compile_fixtures.py
      - name: Verify fixture reproducibility with this compiler
        run: python tools/compile_fixtures.py --check
      - name: Reproduce original construction encodings
        run: |
          python tools/construction_fixtures.py
          python tools/construction_fixtures.py --check
      - name: Reproduce original Code-validation encodings and verification-stage oracle
        run: |
          python tools/code_validation_reference.py
          python tools/code_validation_reference.py --check
      - name: Generate type-state verification probes with the current JDK
        run: python tools/type_state_reference.py
      - name: Check type-state probe reproducibility
        run: python tools/type_state_reference.py --check
      - name: Compare this JDK's verification stages with the committed reference
        run: git diff --exit-code -- tests/fixtures/reference/type-state.tsv
      - name: Record whole-class stages with this JDK
        run: python tools/class_proof_reference.py
      - name: Check whole-class reference reproducibility
        run: python tools/class_proof_reference.py --check
      - name: Compare all whole-class stages with the committed reference
        run: git diff --exit-code -- tests/fixtures/reference/class-proof.tsv
      - name: Check fresh-loader preparation and subsequent loads against JDK 21
        run: |
          python -m unittest discover -s tools -p test_loading_constraint_reference.py
          python tools/loading_constraint_reference.py --check
      - name: Replay member resolution and dispatch against JDK 21
        run: |
          python -m unittest discover -s tools -p test_member_resolution_reference.py
          python tools/member_resolution_reference.py --check
      - name: Check original directory-launch cases against JDK 21
        run: |
          python -m unittest discover -s tools -p test_application_entry_reference.py
          python tools/application_entry_reference.py --check
      - name: Replay monitor ownership and return behavior on JDK 21
        run: |
          python -m unittest discover -s tools -p test_monitor_reference.py
          python tools/monitor_reference.py --check
      - name: Replay class literals and getClass calls on JDK 21
        run: |
          python -m unittest discover -s tools -p test_class_mirror_reference.py
          python tools/class_mirror_reference.py --check
      - name: Build independent JDK metadata inspector
        run: cargo build -p crabspot-launcher --locked
      - name: Capture this JDK's verifier metadata
        run: python tools/type_verification_facts.py
      - name: Reproduce this JDK's verifier metadata
        run: python tools/type_verification_facts.py --check
      - name: Verify regenerated type-state provenance
        run: python tools/check_fixture_sources.py
      - name: Generate and verify numeric reference output with this JDK
        run: |
          python tools/numeric_reference.py
          python tools/numeric_reference.py --check
          python tools/floating_reference.py
          python tools/floating_reference.py --check
          python tools/call_reference.py
          python tools/call_reference.py --check
          python tools/array_reference.py
          python tools/array_reference.py --check
          python tools/field_reference.py
          python tools/field_reference.py --check
          python tools/instance_reference.py
          python tools/instance_reference.py --check
          python tools/virtual_reference.py
          python tools/virtual_reference.py --check
          python tools/interface_dispatch_reference.py
          python tools/interface_dispatch_reference.py --check
          python tools/special_reference.py
          python tools/special_reference.py --check
          python tools/type_reference.py
          python tools/type_reference.py --check
          python tools/reference_field_reference.py
          python tools/reference_field_reference.py --check
          python tools/reference_array_reference.py
          python tools/reference_array_reference.py --check
          python tools/multidimensional_reference.py
          python tools/multidimensional_reference.py --check
          python tools/reference_call_reference.py
          python tools/reference_call_reference.py --check
          python tools/exception_reference.py
          python tools/exception_reference.py --check
          python tools/static_reference.py
          python tools/static_reference.py --check
          python tools/initialization_reference.py
          python tools/initialization_reference.py --check
          python tools/cross_static_reference.py
          python tools/cross_static_reference.py --check
          python tools/construction_reference.py
          python tools/construction_reference.py --check
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test freshly compiled fixtures
        run: cargo test --workspace --locked
      - name: Interpreter results in optimized builds
        run: cargo test -p crabspot-interpreter --release --locked
      - name: Runtime invariants in optimized builds
        run: cargo test -p crabspot-runtime --release --locked
      - name: Code validation in optimized builds
        run: cargo test -p crabspot-verifier --release --locked
      - name: Verified launcher in optimized builds
        run: cargo test -p crabspot-launcher --release --locked
      - name: Check parser fuzz seed limits
        run: cargo test -p crabspot-classfile --example fuzz_parser --locked
      - name: Seeded parser fuzz smoke test
        run: cargo run -p crabspot-classfile --example fuzz_parser --locked -- tests/fixtures --iterations 10000
      - name: Test the bounded java.base input reader
        run: cargo test -p crabspot-verifier --example verify_java_base --locked
      - name: Verify every ordinary definition in this JDK's java.base module
        run: python tools/verify_java_base.py
      - name: Run verified Java applications on CrabSpot with this JDK's platform classes
        run: python tools/verify_application_entry.py
      - name: Run synchronized applications and check monitor failures on CrabSpot
        run: python tools/verify_monitor_entry.py
      - name: Run class literals and getClass through CrabSpot
        run: |
          python -m unittest discover -s tools -p test_class_mirror_launch.py
          python tools/verify_class_mirror_entry.py
